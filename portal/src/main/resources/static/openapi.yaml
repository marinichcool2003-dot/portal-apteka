components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: X-Access-Token
      description: JWT access token. Cookie `X-Refresh-Token` используется только `/api/v1/auth/refresh`.
    csrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Значение должно совпадать с cookie `XSRF-TOKEN`; обязательно для unsafe запросов.
  parameters:
    CsrfHeader: { name: X-XSRF-TOKEN, in: header, required: true, schema: { type: string }, description: Значение cookie XSRF-TOKEN }
    UuidId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    TaskId: { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    IntegerId: { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    UserGroupId: { name: userGroupId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    GroupIdQuery: { name: groupId, in: query, schema: { type: integer, minimum: 1 } }
    IsActive: { name: isActive, in: query, schema: { type: boolean, default: true } }
    IsActiveOptional: { name: isActive, in: query, schema: { type: boolean } }
    FullName: { name: fullName, in: query, schema: { type: string } }
    ExtensionNumber: { name: extensionNumber, in: query, schema: { type: string, pattern: '^[0-9]+$' } }
    ClientFilterLogin: { name: login, in: query, schema: { type: string, format: email } }
    ClientFilterPhone: { name: phoneNumber, in: query, schema: { type: string } }
    ClientPage: { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    ClientSize: { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    ClientSort: { name: sort, in: query, description: 'Массив `property,asc|desc`; недопустимое значение заменяется default.', schema: { type: array, items: { type: string, enum: ['account.userGroup.id,asc', 'account.userGroup.id,desc', 'fullName,asc', 'fullName,desc', 'createdAt,asc', 'createdAt,desc', 'updatedAt,asc', 'updatedAt,desc'] }, default: ['account.userGroup.id,asc', 'fullName,asc'] }, style: form, explode: true }
    AptekaPage: { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    AptekaSize: { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    AptekaSort: { name: sort, in: query, description: 'Недопустимое значение заменяется default.', schema: { type: array, items: { type: string, enum: ['number,asc', 'number,desc', 'address.city,asc', 'address.city,desc', 'address.street,asc', 'address.street,desc', 'account.userGroup.id,asc', 'account.userGroup.id,desc', 'createdAt,asc', 'createdAt,desc', 'updatedAt,asc', 'updatedAt,desc', 'account.login,asc', 'account.login,desc', 'account.phoneNumber,asc', 'account.phoneNumber,desc'] }, default: ['account.userGroup.id,asc', 'number,asc'] }, style: form, explode: true }
    TaskPage: { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    TaskSize: { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    TaskSort: { name: sort, in: query, description: 'Массив `property,asc|desc`. Недопустимое значение вызывает fallback на default `creationDate,asc`. default size=20, max=100.', schema: { type: array, items: { type: string, enum: ['creationDate,asc', 'creationDate,desc', 'updatedDate,asc', 'updatedDate,desc', 'closingDate,asc', 'closingDate,desc', 'status,asc', 'status,desc', 'workType.name,asc', 'workType.name,desc', 'workType.priority,asc', 'workType.priority,desc', 'workType.groupTask.name,asc', 'workType.groupTask.name,desc', 'workType.groupTask.creatorGroup.id,asc', 'workType.groupTask.creatorGroup.id,desc', 'workType.groupTask.intendedGroup.id,asc', 'workType.groupTask.intendedGroup.id,desc', 'creator.userGroup.id,asc', 'creator.userGroup.id,desc', 'assigner.userGroup.id,asc', 'assigner.userGroup.id,desc'] }, default: ['creationDate,asc'] }, style: form, explode: true }
    TaskFilters: { name: status, in: query, schema: { $ref: '#/components/schemas/TaskStatus' } }
  responses:
    BadRequest: { description: Некорректный запрос, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Unauthorized: { description: Не авторизован, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Forbidden: { description: Недостаточно прав, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    NotFound: { description: Ресурс не найден, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Conflict: { description: Конфликт данных, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    Client: { description: Сотрудник, content: { application/json: { schema: { $ref: '#/components/schemas/Client' } } } }
    Apteka: { description: Аптека, content: { application/json: { schema: { $ref: '#/components/schemas/Apteka' } } } }
    Task: { description: Задача, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
    TaskShort: { description: Задача, content: { application/json: { schema: { $ref: '#/components/schemas/TaskShort' } } } }
    ClientPage: { description: Страница сотрудников, content: { application/json: { schema: { $ref: '#/components/schemas/ClientPage' } } } }
    AptekaPage: { description: Страница аптек, content: { application/json: { schema: { $ref: '#/components/schemas/AptekaPage' } } } }
    TaskPage: { description: Страница задач, content: { application/json: { schema: { $ref: '#/components/schemas/TaskPage' } } } }
    UserGroup: { description: Группа пользователей, content: { application/json: { schema: { $ref: '#/components/schemas/UserGroup' } } } }
    UserGroupList: { description: Список групп пользователей, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/UserGroup' } } } } }
    GroupTask: { description: Группа задач, content: { application/json: { schema: { $ref: '#/components/schemas/GroupTask' } } } }
    GroupTaskList: { description: Список групп задач, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/GroupTask' } } } } }
    WorkType: { description: Вид работы, content: { application/json: { schema: { $ref: '#/components/schemas/WorkType' } } } }
    WorkTypeList: { description: Список видов работ, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/WorkType' } } } } }
    News: { description: Новость, content: { application/json: { schema: { $ref: '#/components/schemas/News' } } } }
    NewsList: { description: Список новостей, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/News' } } } } }
    MainPageLink: { description: Ссылка главной страницы, content: { application/json: { schema: { $ref: '#/components/schemas/MainPageLink' } } } }
    MainPageLinkList: { description: Список ссылок, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MainPageLink' } } } } }
    GroupMainPageLinks: { description: Группа ссылок, content: { application/json: { schema: { $ref: '#/components/schemas/GroupMainPageLinks' } } } }
    GroupMainPageLinksList: { description: Список групп ссылок, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/GroupMainPageLinks' } } } } }
  schemas:
    ErrorResponse: { type: object, required: [status, errorMessage, currentTimesMillis], properties: { status: { type: integer, example: 400 }, errorMessage: { type: string }, currentTimesMillis: { type: integer, format: int64, example: 1716282000000 } } }
    TaskStatus: { type: string, enum: [OPEN, CLOSED, DENIED, PROCESSED], description: 'OPEN — Открыта; CLOSED — Задача выполнена; DENIED — Задача отклонена; PROCESSED — В процессе выполнения.' }
    TaskPriority: { type: string, enum: [LOW, MIDDLE, HIGH], description: 'LOW — Низкий; MIDDLE — Средний; HIGH — Высокий.' }
    UserRole: { type: string, enum: [ADMIN, BOSS, USER, APTEKA], description: 'ADMIN — Администратор; BOSS — Босс; USER — Сотрудник; APTEKA — Аптека.' }
    UserType: { type: string, enum: [CLIENT, APTEKA], description: 'CLIENT — Сотрудник; APTEKA — Аптека.' }
    AccountAction:
      type: string
      enum: [NEWS_WORK, NEWS_WORK_ALL_GROUPS, UPDATE_ALL_NEWS_IN_GROUP, UPDATE_ALL_NEWS_CREATE_GROUP, UPDATE_ALL_NEWS, DELETE_ALL_NEWS_CREATE_GROUP, DELETE_ALL_NEWS_IN_GROUP, DELETE_ALL_NEWS, CREATE_APTEKA, UPDATE_APTEKA, UPDATE_APTEKA_ACCOUNT, UPDATE_APTEKA_DESCRIPTION, SAFE_DELETE_APTEKA, PERMANENT_DELETE_APTEKA, CAN_SELECT_NON_ACTIVE_MAIN_PAGE_LINK, CREATE_MAIN_PAGE_LINK, UPDATE_MAIN_PAGE_LINK, SAFE_DELETE_MAIN_PAGE_LINK, CAN_ACTIVATE_MAIN_PAGE_LINK_AFTER_SAFE_DELETE, PERMANENT_DELETE_MAIN_PAGE_LINK, CAN_SELECT_NON_ACTIVE_CLIENT_IN_GROUP, CAN_SELECT_NON_ACTIVE_CLIENT_GRAND, CAN_SELECT_CLIENT_STATS_IN_GROUP, CAN_SELECT_CLIENT_STATS_GRAND, CREATE_CLIENT, CAN_GIVE_ROLE_CLIENT_GRAND, CAN_ADD_ACCOUNT_ACTIONS_IN_GROUP, CAN_ADD_ACCOUNT_ACTIONS_GRAND, CAN_ADD_ACCOUNT_ACTIONS_GRAND_EXTENDED, CAN_REMOVE_ACCOUNT_ACTIONS_IN_GROUP, CAN_REMOVE_ACCOUNT_ACTIONS_GRAND_EXTENDED, UPDATE_CLIENT_IN_GROUP, UPDATE_CLIENT_ACCOUNT_GRAND, UPDATE_CLIENT_DESCRIPTION_IN_GROUP, UPDATE_CLIENT_DESCRIPTION_GRAND, UPDATE_CLIENT_IN_GROUP_GRAND, UPDATE_CLIENT_GRAND, SAFE_DELETE_CLIENT_IN_GROUP, SAFE_DELETE_CLIENT_GRAND, CAN_ACTIVATE_CLIENT_AFTER_SAFE_DELETE, PERMANENT_DELETE_CLIENT, CAN_SELECT_ALL_NON_ACTIVE_GROUPS, CAN_SELECT_ALL_ACTIVE_GROUPS, CAN_CREATE_USER_GROUP, CAN_UPDATE_SELF_USER_GROUP, CAN_UPDATE_USER_GROUP, SAFE_DELETE_USER_GROUP, CAN_ACTIVATE_USER_GROUP_AFTER_SAFE_DELETE, PERMANENT_DELETE_USER_GROUP, BASE_WORK_WITH_GROUP_TASK, GRAND_WORK_WITH_GROUP_TASK, NON_SAFE_UPDATE, CAN_PERMANENT_DELETE_GROUP_TASK, BASE_WORK_WITH_WORK_TYPE, GRAND_WORK_WITH_WORK_TYPE, NON_SAFE_UPDATE_WORK_TYPE, CAN_PERMANENT_DELETE_WORK_TYPE, CAN_DISTRIBUTE_TASK_IN_GROUP, CAN_CREATE_TASK_ANOTHER_GROUP, CAN_CREATE_TASK_ANOTHER_GROUP_TO_ASSIGNER, CAN_CREATE_TASK_ANOTHER_GROUP_TO_ASSIGNER_GRAND, CAN_CREATE_TASK_TO_APTEKI, CAN_SELECT_USER_GROUP_STATS, CAN_SELECT_USER_GROUP_STATS_ALL_VISIBILITY, CAN_SELECT_USER_GROUP_STATS_GRAND, CAN_SELECT_ANOTHER_GROUP_TASKS, CAN_CHANGE_ASSIGNER_ASSIGNED_YOU, CAN_CHANGE_ASSIGNER_ASSIGNED_YOU_ANOTHER_GROUP_TO_ASSIGNER, CAN_CHANGE_ASSIGNER_ASSIGNED_NOT_YOU_IN_GROUP, CAN_CHANGE_ASSIGNER_ASSIGNED_NOT_YOU_ANOTHER_GROUP, CAN_CHANGE_ASSIGNER_GROUP_FROM_YOUR_GROUP, CAN_CHANGE_STATUS_TASK_IN_GROUP, CAN_CHANGE_STATUS_TASK_ASSIGNED_IN_GROUP, CAN_UPDATE_TITLE_BEFORE_ASSIGNED, CAN_FULL_IPDATE_TITLE_BEFORE_ASSIGNED, CAN_UPDATE_TASK, CAN_PERMANENT_DELETE_TASK]
      description: 'Коды действий AccountAction.java. NEWS_WORK — работа с новостями своей группы; NEWS_WORK_ALL_GROUPS — новости всех групп; UPDATE_ALL_NEWS* / DELETE_ALL_NEWS* — управление новостями; CREATE_APTEKA / UPDATE_APTEKA* / *DELETE_APTEKA — управление аптеками; *MAIN_PAGE_LINK* — ссылки главной страницы; *CLIENT* и *ACCOUNT_ACTIONS* — управление сотрудниками; *USER_GROUP* — управление группами; *GROUP_TASK* и *WORK_TYPE* — типы задач; CAN_*TASK* — создание, просмотр, распределение и изменение задач.'
    LoginRequest: { type: object, required: [login, password], properties: { login: { type: string }, password: { type: string, format: password }, rememberMe: { type: boolean, default: false } } }
