openapi: 3.0.3
info:
  title: Портал Социальных аптек API
  version: 1.0.0
  description: |
    Контракт REST API портала. Аутентификация выполняется HTTP-only cookie `X-Access-Token`;
    обновление — cookie `X-Refresh-Token`. Для каждого POST, PUT, PATCH и DELETE передавайте
    cookie `XSRF-TOKEN` и одноимённый заголовок `X-XSRF-TOKEN`.
servers:
  - url: /
tags:
  - { name: Авторизация }
  - { name: Сотрудники }
  - { name: Аптеки }
  - { name: Задачи }
  - { name: Группы задач }
  - { name: Виды работ }
  - { name: Группы пользователей }
  - { name: Новости }
  - { name: Комментарии к задачам }
  - { name: Картинки задач }
  - { name: Ссылки главной страницы }
  - { name: SSE }
security:
  - cookieAuth: []
paths:
  /api/v1/auth/csrf:
    get:
      tags: [Авторизация]
      summary: Выдать CSRF cookie (bootstrap)
      description: |
        Публичный bootstrap для SPA. Ответ `204` сопровождается Set-Cookie `XSRF-TOKEN`
        (readable для JS). Перед login/refresh/logout и любым mutation передайте заголовок `X-XSRF-TOKEN`.
      security: []
      responses:
        '204':
          description: CSRF cookie установлена
          headers:
            Set-Cookie:
              schema: { type: string }
              description: XSRF-TOKEN=<token>; Path=/; SameSite=Lax
  /api/v1/auth/login:
    post:
      tags: [Авторизация]
      summary: Авторизация
      security: []
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }
      responses:
        '200': { description: Токены установлены в cookies, headers: { Set-Cookie: { schema: { type: string } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/auth/refresh:
    post:
      tags: [Авторизация]
      summary: Обновить токены
      security: []
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      responses:
        '200': { description: Токены обновлены, headers: { Set-Cookie: { schema: { type: string } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/logout:
    post:
      tags: [Авторизация]
      summary: Выход из системы
      security: []
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      responses: { '200': { description: Cookies удалены } }
  /api/v1/auth/invalidate-all:
    post:
      tags: [Авторизация]
      summary: Завершить все сессии пользователя
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      responses: { '204': { description: Сессии завершены }, '401': { $ref: '#/components/responses/Unauthorized' } }

  /api/v1/clients:
    get:
      tags: [Сотрудники]
      summary: Получить сотрудников
      parameters: [ { $ref: '#/components/parameters/ClientPage' }, { $ref: '#/components/parameters/ClientSize' }, { $ref: '#/components/parameters/ClientSort' }, { $ref: '#/components/parameters/IsActive' } ]
      responses: { '200': { $ref: '#/components/responses/ClientPage' } }
    post:
      tags: [Сотрудники]
      summary: Создать сотрудника
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClientCreateRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Client' }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/clients/{id}:
    get:
      tags: [Сотрудники]
      summary: Получить сотрудника
      parameters: [ { $ref: '#/components/parameters/UuidId' } ]
      responses: { '200': { $ref: '#/components/responses/Client' }, '404': { $ref: '#/components/responses/NotFound' } }
  /api/v1/clients/me:
    get: { tags: [Сотрудники], summary: Текущий сотрудник, responses: { '200': { $ref: '#/components/responses/Client' } } }
  /api/v1/clients/my-stats:
    get: { tags: [Сотрудники], summary: Статистика задач текущего сотрудника, responses: { '200': { content: { application/json: { schema: { $ref: '#/components/schemas/TaskStats' } } } } } }
  /api/v1/clients/by-user-group/{userGroupId}:
    get:
      tags: [Сотрудники]
      summary: Получить сотрудников группы
      parameters: [ { $ref: '#/components/parameters/UserGroupId' }, { $ref: '#/components/parameters/ClientPage' }, { $ref: '#/components/parameters/ClientSize' }, { $ref: '#/components/parameters/ClientSort' }, { $ref: '#/components/parameters/IsActive' } ]
      responses: { '200': { $ref: '#/components/responses/ClientPage' } }
  /api/v1/clients/by-user-group/task-number/{userGroupId}:
    get:
      tags: [Сотрудники]
      summary: Статистика сотрудников группы
      parameters: [ { $ref: '#/components/parameters/UserGroupId' }, { $ref: '#/components/parameters/IsActive' } ]
      responses: { '200': { content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ClientWithStats' } } } } } }
  /api/v1/clients/filter:
    get:
      tags: [Сотрудники]
      summary: Фильтровать сотрудников
      parameters: [ { $ref: '#/components/parameters/ClientFilterLogin' }, { $ref: '#/components/parameters/ClientFilterPhone' }, { $ref: '#/components/parameters/GroupIdQuery' }, { $ref: '#/components/parameters/FullName' }, { $ref: '#/components/parameters/ExtensionNumber' }, { $ref: '#/components/parameters/IsActiveOptional' }, { $ref: '#/components/parameters/ClientPage' }, { $ref: '#/components/parameters/ClientSize' }, { $ref: '#/components/parameters/ClientSort' } ]
      responses: { '200': { $ref: '#/components/responses/ClientPage' } }
  /api/v1/clients/update-account/{id}:
    put:
      tags: [Сотрудники]
      summary: Обновить аккаунт сотрудника
      parameters: [ { $ref: '#/components/parameters/UuidId' }, { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AccountUpdateRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Client' } }
  /api/v1/clients/update-description/{id}:
    put:
      tags: [Сотрудники]
      summary: Обновить описание сотрудника
      parameters: [ { $ref: '#/components/parameters/UuidId' }, { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ClientUpdateDescriptionRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Client' } }
  /api/v1/clients/update-profile:
    put:
      tags: [Сотрудники]
      summary: Обновить свой профиль
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/ClientProfileMultipart' } } } }
      responses: { '200': { $ref: '#/components/responses/Client' } }
  /api/v1/clients/update-all/{id}:
    put:
      tags: [Сотрудники]
      summary: Полностью обновить сотрудника
      parameters: [ { $ref: '#/components/parameters/UuidId' }, { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { multipart/form-data: { schema: { $ref: '#/components/schemas/ClientFullMultipart' } } } }
      responses: { '200': { $ref: '#/components/responses/Client' } }
  /api/v1/clients/add-actions/{id}:
    put:
      tags: [Сотрудники]
      summary: Добавить действия сотруднику
      parameters: [ { $ref: '#/components/parameters/UuidId' }, { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/AccountAction' } } } } }
      responses: { '204': { description: Действия добавлены } }
  /api/v1/clients/remove-actions/{id}:
    put:
      tags: [Сотрудники]
      summary: Удалить действия сотрудника
      parameters: [ { $ref: '#/components/parameters/UuidId' }, { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/AccountAction' } } } } }
      responses: { '204': { description: Действия удалены } }
  /api/v1/clients/safe-delete/{id}:
    patch: { tags: [Сотрудники], summary: Безопасно удалить сотрудника, parameters: [ { $ref: '#/components/parameters/UuidId' }, { $ref: '#/components/parameters/CsrfHeader' } ], responses: { '204': { description: Сотрудник деактивирован } } }
  /api/v1/clients/restore-after-safe-delete/{id}:
    patch: { tags: [Сотрудники], summary: Восстановить сотрудника, parameters: [ { $ref: '#/components/parameters/UuidId' }, { $ref: '#/components/parameters/CsrfHeader' } ], responses: { '204': { description: Сотрудник восстановлен } } }
  /api/v1/clients/permanent-delete/{id}:
    delete: { tags: [Сотрудники], summary: Удалить сотрудника безвозвратно, parameters: [ { $ref: '#/components/parameters/UuidId' }, { $ref: '#/components/parameters/CsrfHeader' } ], responses: { '204': { description: Сотрудник удалён } } }

  /api/v1/apteka:
    get:
      tags: [Аптеки]
      summary: Получить аптеки
      parameters: [ { $ref: '#/components/parameters/AptekaPage' }, { $ref: '#/components/parameters/AptekaSize' }, { $ref: '#/components/parameters/AptekaSort' }, { $ref: '#/components/parameters/IsActive' } ]
      responses: { '200': { $ref: '#/components/responses/AptekaPage' } }
    post:
      tags: [Аптеки]
      summary: Создать аптеку
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AptekaRequest' } } } }
      responses: { '201': { $ref: '#/components/responses/Apteka' } }
  /api/v1/apteka/{id}:
    get: { tags: [Аптеки], summary: Получить аптеку, parameters: [ { $ref: '#/components/parameters/UuidId' }, { $ref: '#/components/parameters/IsActive' } ], responses: { '200': { $ref: '#/components/responses/Apteka' } } }
    put:
      tags: [Аптеки]
      summary: Полностью обновить аптеку
      parameters: [ { $ref: '#/components/parameters/UuidId' }, { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AptekaUpdateRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Apteka' } }
    patch: { tags: [Аптеки], summary: Безопасно удалить аптеку, parameters: [ { $ref: '#/components/parameters/UuidId' }, { $ref: '#/components/parameters/CsrfHeader' } ], responses: { '204': { description: Аптека деактивирована } } }
    delete: { tags: [Аптеки], summary: Удалить аптеку безвозвратно, parameters: [ { $ref: '#/components/parameters/UuidId' }, { $ref: '#/components/parameters/CsrfHeader' } ], responses: { '204': { description: Аптека удалена } } }
  /api/v1/apteka/me:
    get: { tags: [Аптеки], summary: Текущая аптека, parameters: [ { $ref: '#/components/parameters/IsActive' } ], responses: { '200': { $ref: '#/components/responses/Apteka' } } }
  /api/v1/apteka/filter:
    get:
      tags: [Аптеки]
      summary: Фильтровать аптеки
      parameters: [ { name: login, in: query, schema: { type: string } }, { $ref: '#/components/parameters/GroupIdQuery' }, { name: number, in: query, schema: { type: integer, minimum: 1 } }, { name: phoneNumber, in: query, schema: { type: string } }, { name: city, in: query, schema: { type: string } }, { name: street, in: query, schema: { type: string } }, { $ref: '#/components/parameters/AptekaPage' }, { $ref: '#/components/parameters/AptekaSize' }, { $ref: '#/components/parameters/AptekaSort' }, { $ref: '#/components/parameters/IsActive' } ]
      responses: { '200': { $ref: '#/components/responses/AptekaPage' } }
  /api/v1/apteka/account/{id}:
    put: { tags: [Аптеки], summary: Обновить аккаунт аптеки, parameters: [ { $ref: '#/components/parameters/UuidId' }, { $ref: '#/components/parameters/CsrfHeader' } ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AccountUpdateRequest' } } } }, responses: { '200': { $ref: '#/components/responses/Apteka' } } }
  /api/v1/apteka/description/{id}:
    put: { tags: [Аптеки], summary: Обновить описание аптеки, parameters: [ { $ref: '#/components/parameters/UuidId' }, { $ref: '#/components/parameters/CsrfHeader' } ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AptekaUpdateDescriptionRequest' } } } }, responses: { '200': { $ref: '#/components/responses/Apteka' } } }

  /api/v1/tasks:
    get: { tags: [Задачи], summary: Получить все задачи, parameters: [ { $ref: '#/components/parameters/TaskPage' }, { $ref: '#/components/parameters/TaskSize' }, { $ref: '#/components/parameters/TaskSort' } ], responses: { '200': { $ref: '#/components/responses/TaskPage' } } }
    post: { tags: [Задачи], summary: Создать задачу, parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCreateRequest' } } } }, responses: { '201': { $ref: '#/components/responses/TaskShort' } } }
  /api/v1/tasks/{id}:
    get: { tags: [Задачи], summary: Получить задачу, parameters: [ { $ref: '#/components/parameters/TaskId' } ], responses: { '200': { $ref: '#/components/responses/Task' } } }
    put: { tags: [Задачи], summary: Изменить задачу, parameters: [ { $ref: '#/components/parameters/TaskId' }, { $ref: '#/components/parameters/CsrfHeader' } ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaskUpdateRequest' } } } }, responses: { '200': { $ref: '#/components/responses/TaskShort' } } }
    delete: { tags: [Задачи], summary: Удалить задачу, parameters: [ { $ref: '#/components/parameters/TaskId' }, { $ref: '#/components/parameters/CsrfHeader' } ], responses: { '204': { description: Задача удалена } } }
  /api/v1/tasks/tasks-assigned-me:
    get: { tags: [Задачи], summary: Задачи, назначенные мне, parameters: [ { $ref: '#/components/parameters/TaskFilters' }, { $ref: '#/components/parameters/TaskPage' }, { $ref: '#/components/parameters/TaskSize' }, { $ref: '#/components/parameters/TaskSort' } ], responses: { '200': { $ref: '#/components/responses/TaskPage' } } }
  /api/v1/tasks/tasks-assigned-my-group:
    get: { tags: [Задачи], summary: Задачи моей группы, parameters: [ { $ref: '#/components/parameters/TaskFilters' }, { $ref: '#/components/parameters/TaskPage' }, { $ref: '#/components/parameters/TaskSize' }, { $ref: '#/components/parameters/TaskSort' } ], responses: { '200': { $ref: '#/components/responses/TaskPage' } } }
  /api/v1/tasks/tasks-created-by-me:
    get: { tags: [Задачи], summary: Созданные мной задачи, parameters: [ { $ref: '#/components/parameters/TaskFilters' }, { $ref: '#/components/parameters/TaskPage' }, { $ref: '#/components/parameters/TaskSize' }, { $ref: '#/components/parameters/TaskSort' } ], responses: { '200': { $ref: '#/components/responses/TaskPage' } } }
  /api/v1/tasks/full-filter:
    get:
      tags: [Задачи]
      summary: Полная фильтрация задач
      parameters: [ { $ref: '#/components/parameters/GroupIdQuery' }, { name: creatorId, in: query, schema: { type: string, format: uuid } }, { name: assignerId, in: query, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/TaskFilters' }, { $ref: '#/components/parameters/TaskPage' }, { $ref: '#/components/parameters/TaskSize' }, { $ref: '#/components/parameters/TaskSort' } ]
      responses: { '200': { $ref: '#/components/responses/TaskPage' } }
  /api/v1/tasks/group-user-stats:
    get: { tags: [Задачи], summary: Статистика всех групп, responses: { '200': { content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DepartmentTaskStats' } } } } } } }
  /api/v1/tasks/group-user-stats/{id}:
    get: { tags: [Задачи], summary: Статистика группы, parameters: [ { $ref: '#/components/parameters/IntegerId' } ], responses: { '200': { content: { application/json: { schema: { $ref: '#/components/schemas/DepartmentTaskStats' } } } } } }

  /api/v1/task-comments/by-task/{taskId}:
    get: { tags: [Комментарии к задачам], summary: Комментарии задачи, parameters: [ { $ref: '#/components/parameters/TaskId' } ], responses: { '200': { content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TaskComment' } } } } } } }
  /api/v1/task-comments:
    post: { tags: [Комментарии к задачам], summary: Создать комментарий, parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TaskCommentRequest' } } } }, responses: { '201': { content: { application/json: { schema: { $ref: '#/components/schemas/TaskComment' } } } } } }
  /api/v1/task-comments/{id}:
    get: { tags: [Комментарии к задачам], summary: Получить комментарий, parameters: [ { $ref: '#/components/parameters/TaskId' } ], responses: { '200': { content: { application/json: { schema: { $ref: '#/components/schemas/TaskComment' } } } } } }
    delete: { tags: [Комментарии к задачам], summary: Удалить комментарий, parameters: [ { $ref: '#/components/parameters/TaskId' }, { $ref: '#/components/parameters/CsrfHeader' } ], responses: { '204': { description: Комментарий удалён } } }
  /api/v1/task-pictures/upload-to-task/{taskId}:
    post:
      tags: [Картинки задач]
      summary: Загрузить картинку задачи
      parameters: [ { $ref: '#/components/parameters/TaskId' }, { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } } }
      responses: { '201': { content: { application/json: { schema: { $ref: '#/components/schemas/TaskPicture' } } } } }
  /api/v1/task-pictures/{pictureId}:
    get:
      tags: [Картинки задач]
      summary: Скачать картинку
      parameters: [ { name: pictureId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } } ]
      responses: { '200': { description: Бинарный файл, headers: { Content-Disposition: { schema: { type: string } } }, content: { application/octet-stream: { schema: { type: string, format: binary } } } } }

  /api/v1/sse/subscribe:
    get:
      tags: [SSE]
      summary: Подписаться на поток уведомлений
      description: Долгоживущее Server-Sent Events соединение, heartbeat каждые 30 секунд.
      responses: { '200': { description: Поток SSE, content: { text/event-stream: { schema: { type: string, example: "event: CONNECT\ndata: Успешное подключение к portal_apteka\n\n" } } } } }

  /api/v1/user-groups:
    get: { tags: [Группы пользователей], summary: Получить группы пользователей, parameters: [ { $ref: '#/components/parameters/IsActive' } ], responses: { '200': { $ref: '#/components/responses/UserGroupList' } } }
    post: { tags: [Группы пользователей], summary: Создать группу пользователей, parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserGroupRequest' } } } }, responses: { '201': { $ref: '#/components/responses/UserGroup' } } }
  /api/v1/user-groups/{id}:
    get: { tags: [Группы пользователей], summary: Получить группу пользователей, parameters: [ { $ref: '#/components/parameters/IntegerId' }, { $ref: '#/components/parameters/IsActive' } ], responses: { '200': { $ref: '#/components/responses/UserGroup' } } }
    put: { tags: [Группы пользователей], summary: Обновить группу пользователей, parameters: [ { $ref: '#/components/parameters/IntegerId' }, { $ref: '#/components/parameters/CsrfHeader' } ], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserGroupUpdateRequest' } } } }, responses: { '200': { $ref: '#/components/responses/UserGroup' } } }
    delete: { tags: [Группы пользователей], summary: Удалить группу пользователей, parameters: [ { $ref: '#/components/parameters/IntegerId' }, { name: confirm, in: query, schema: { type: boolean, default: false } }, { $ref: '#/components/parameters/CsrfHeader' } ], responses: { '204': { description: Группа удалена } } }
  /api/v1/user-groups/visible:
    get: { tags: [Группы пользователей], summary: Получить видимые группы, responses: { '200': { $ref: '#/components/responses/UserGroupList' } } }
  /api/v1/user-groups/safe-delete/{id}:
    patch: { tags: [Группы пользователей], summary: Безопасно удалить группу, parameters: [ { $ref: '#/components/parameters/IntegerId' }, { $ref: '#/components/parameters/CsrfHeader' } ], responses: { '204': { description: Группа деактивирована } } }
  /api/v1/user-groups/restore/{id}:
    patch: { tags: [Группы пользователей], summary: Восстановить группу, parameters: [ { $ref: '#/components/parameters/IntegerId' }, { $ref: '#/components/parameters/CsrfHeader' } ], responses: { '204': { description: Группа восстановлена } } }

  /api/v1/group-tasks:
    get: { tags: [Группы задач], summary: Получить группы задач по группам пользователей, parameters: [ { name: creatorGroupId, in: query, required: true, schema: { type: integer, minimum: 1 } }, { name: executorGroupId, in: query, required: true, schema: { type: integer, minimum: 1 } }, { $ref: '#/components/parameters/IsActive' } ], responses: { '200': { $ref: '#/components/responses/GroupTaskList' } } }
