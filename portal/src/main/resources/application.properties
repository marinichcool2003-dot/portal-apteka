spring.application.name=portal

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}
jwt.refresh.expiration-with-remember=${JWT_REFRESH_EXPIRATION_WITH_REMEMBER:2592000000}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.connect-timeout=1000
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=redis

app.rate-limit.login.max-requests=5
app.rate-limit.login.window-minutes=1
app.rate-limit.login.fail-open=true

app.cache.key-prefix=${CACHE_KEY_PREFIX:portal:v2:}
app.cache.clear-on-startup=false
app.data-initializer.enabled=${DATA_INITIALIZER_ENABLED:true}

app.default.admin.login=${ADMIN_LOGIN}
app.default.admin.password=${ADMIN_PASSWORD}
app.default.react.host=${REACT_HOST:http://localhost:5174}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${REACT_HOST:http://localhost:5174}}

app.default.upload.task-picture.dir=${DEFAULT_UPLOAD_DIR:uploads/pictures}
app.default.avatars.upload.dir=${DEFAULT_AVATARS_DIR:uploads/avatars}
app.default.avatars.upload.picture.user=${DEFAULT_USER_AVATAR_PICTURE:/default-client-avatar.png}
app.default.avatars.upload.picture.group=${DEFAULT_GROUP_AVATAR_PICTURE:/default-group-avatar.png}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.with-credentials=true
springdoc.override-with-generic-response=false
springdoc.swagger-ui.csrf.enabled=true

spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.leak-detection-threshold=10000
spring.datasource.hikari.connection-timeout=5000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

cookie.secure.flag=false

app.rate-limit.login.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false
spring.mail.test-connection=false

server.forward-headers-strategy=framework

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:noreply@farmp.ru}
app.mail.brand.name=\u0421\u043e\u0446\u0438\u0430\u043b\u044c\u043d\u0430\u044f \u0410\u043f\u0442\u0435\u043a\u0430
app.mail.brand.accent-color=#007A33
app.mail.brand.secondary-color=#E31E24
app.mail.brand.text-color=#333333
app.mail.brand.muted-color=#666666
app.mail.brand.background-color=#F5F5F5
app.mail.brand.logo-path=classpath:logo.png

app.mail.brand.portal-url=${MAIL_PORTAL_URL:}
app.mail.retry.cron=0 */5 * * * *

app.report.daily.cron=${DAILY_REPORT_CRON:0 0 6 * * *}
app.report.daily.zone=${DAILY_REPORT_ZONE:Europe/Moscow}
app.otp.ttl-seconds=600
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60
